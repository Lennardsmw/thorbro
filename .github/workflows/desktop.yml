name: Desktop app

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/app
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci || npm install
      # build only; the release is published from the built artifacts (no write token needed here)
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop/app
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: thorbro-desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/app/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/app/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/app/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/app/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/app/src-tauri/target/**/release/bundle/appimage/*.AppImage
